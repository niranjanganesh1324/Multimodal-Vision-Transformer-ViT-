# Training Pipeline Configuration

experiment_name: "multimodal_vit_base"
seed: 42

dataset:
  name: "coco"  # Options: coco, flickr30k, vqa, synthetic
  data_dir: "./data"
  synthetic_fallback: true
  num_samples_synthetic: 200

training:
  epochs: 10
  batch_size: 16
  eval_batch_size: 16
  learning_rate: 3.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.1
  optimizer: "AdamW"  # Options: AdamW, Adam, SGD
  scheduler: "cosine"  # Options: cosine, linear, constant
  gradient_accumulation_steps: 1
  max_grad_norm: 1.0
  mixed_precision: true  # FP16 autocast

losses:
  itc_weight: 1.0       # Image-Text Contrastive Loss weight
  caption_weight: 1.0   # Image Captioning Loss weight
  vqa_weight: 1.0       # Visual Question Answering Loss weight
  label_smoothing: 0.1  # Caption CrossEntropy label smoothing
  temperature: 0.07     # Initial contrastive temperature

logging:
  use_wandb: false
  wandb_project: "multimodal-vit"
  use_tensorboard: true
  log_interval: 10
  save_interval: 1

checkpoint:
  output_dir: "./checkpoints"
  save_best_only: true
  metric_for_best_model: "loss"
  greater_is_better: false

hardware:
  device: "cuda"  # Auto selects cuda if available, else cpu
  num_workers: 2
